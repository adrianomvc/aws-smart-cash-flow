name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect deploy changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changed.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          current="${{ github.sha }}"

          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$current")"
          else
            changed_files="$(git diff --name-only "$before" "$current")"
          fi

          if echo "$changed_files" | grep -Eq '^(frontend/|\.github/workflows/ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-frontend:
    name: Trigger Amplify deploy
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend
      - frontend
    steps:
      - name: Skip deploy when not eligible
        if: ${{ !(github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') && needs.changes.outputs.frontend == 'true' && vars.AWS_ROLE_TO_ASSUME != '' && vars.AWS_REGION != '' && vars.AMPLIFY_APP_ID != '') }}
        run: echo "Amplify deploy only runs for eligible pushes to develop or main with frontend changes."

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') && needs.changes.outputs.frontend == 'true' && vars.AWS_ROLE_TO_ASSUME != '' && vars.AWS_REGION != '' && vars.AMPLIFY_APP_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Trigger branch deploy
        if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') && needs.changes.outputs.frontend == 'true' && vars.AWS_ROLE_TO_ASSUME != '' && vars.AWS_REGION != '' && vars.AMPLIFY_APP_ID != '' }}
        run: |
          set -euo pipefail

          app_id="${{ vars.AMPLIFY_APP_ID }}"
          branch_name="${{ github.ref_name }}"

          latest_status="$(aws amplify list-jobs \
            --app-id "$app_id" \
            --branch-name "$branch_name" \
            --max-items 1 \
            --query 'jobSummaries[0].status' \
            --output text 2>/dev/null || true)"

          if [ "$latest_status" = "PENDING" ] || [ "$latest_status" = "RUNNING" ]; then
            echo "Amplify branch $branch_name already has a $latest_status job; skipping duplicate trigger."
            exit 0
          fi

          set +e
          start_output="$(aws amplify start-job \
            --app-id "$app_id" \
            --branch-name "$branch_name" \
            --job-type RELEASE 2>&1)"
          start_status=$?
          set -e

          if [ "$start_status" -ne 0 ]; then
            if echo "$start_output" | grep -q "pending or running jobs"; then
              echo "Amplify branch $branch_name already has a pending or running job; treating as success."
              exit 0
            fi

            echo "$start_output"
            exit "$start_status"
          fi

          echo "$start_output"

  backend-deploy-placeholder:
    name: Backend deploy gate
    runs-on: ubuntu-latest
    needs:
      - backend
    steps:
      - name: Skip backend deploy when not eligible
        if: ${{ !(github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')) }}
        run: echo "Backend deploy gate only applies to pushes to develop or main."

      - name: Explain backend deploy status
        if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main') }}
        run: |
          echo "Backend deploy is intentionally disabled until infra/Lambda template is added."
          echo "Frontend Amplify deploy runs after backend tests and frontend build pass."
