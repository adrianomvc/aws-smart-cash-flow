name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "codex/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: "Build and deploy the backend Lambda"
        required: false
        type: boolean
        default: true
      deploy_frontend:
        description: "Trigger the Amplify frontend deploy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect deploy changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changed.outputs.backend }}
      frontend: ${{ steps.changed.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect deploy changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=${{ inputs.deploy_backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ inputs.deploy_frontend }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          current="${{ github.sha }}"

          if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$current")"
          else
            changed_files="$(git diff --name-only "$before" "$current")"
          fi

          if echo "$changed_files" | grep -Eq '^(backend/|infra/terraform/|\.github/workflows/ci\.yml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -Eq '^frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy-frontend:
    name: Trigger Amplify deploy
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend
      - frontend
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'main' && needs.changes.outputs.frontend == 'true' && vars.AWS_ROLE_TO_ASSUME != '' && vars.AWS_REGION != '' && vars.AMPLIFY_APP_ID != '' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Trigger branch deploy
        run: |
          set -euo pipefail

          app_id="${{ vars.AMPLIFY_APP_ID }}"
          branch_name="${{ github.ref_name }}"

          latest_status="$(aws amplify list-jobs \
            --app-id "$app_id" \
            --branch-name "$branch_name" \
            --max-items 1 \
            --query 'jobSummaries[0].status' \
            --output text 2>/dev/null || true)"

          if [ "$latest_status" = "PENDING" ] || [ "$latest_status" = "RUNNING" ]; then
            echo "Amplify branch $branch_name already has a $latest_status job; skipping duplicate trigger."
            exit 0
          fi

          set +e
          start_output="$(aws amplify start-job \
            --app-id "$app_id" \
            --branch-name "$branch_name" \
            --job-type RELEASE 2>&1)"
          start_status=$?
          set -e

          if [ "$start_status" -ne 0 ]; then
            if echo "$start_output" | grep -q "pending or running jobs"; then
              echo "Amplify branch $branch_name already has a pending or running job; treating as success."
              exit 0
            fi

            echo "$start_output"
            exit "$start_status"
          fi

          echo "$start_output"

  deploy-backend:
    name: Deploy backend Lambda
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend
    defaults:
      run:
        working-directory: backend
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'main' && needs.changes.outputs.backend == 'true' && vars.AWS_ROLE_TO_ASSUME != '' && vars.AWS_REGION != '' && vars.BACKEND_LAMBDA_FUNCTION_NAME != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build/lambda
          python -m pip install --upgrade pip
          python -m pip install --target build/lambda .

          (
            cd build/lambda
            zip -qr ../backend-lambda.zip .
          )

      - name: Validate Lambda package imports
        run: |
          set -euo pipefail

          PYTHONPATH="build/lambda" python - <<'PY'
          import app.main
          import fastapi
          import mangum

          assert app.main.handler is not None
          assert mangum.Mangum is not None
          print("Lambda package imports OK", fastapi.__version__)
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Lambda code and configuration
        env:
          BACKEND_CORS_ORIGINS: ${{ vars.BACKEND_CORS_ORIGINS }}
          BACKEND_ALLOW_LOCAL_AUTH: ${{ vars.BACKEND_ALLOW_LOCAL_AUTH || 'true' }}
          BACKEND_DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}
          BACKEND_LAMBDA_FUNCTION_NAME: ${{ vars.BACKEND_LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${BACKEND_DATABASE_URL}" ]; then
            echo "Missing required GitHub secret BACKEND_DATABASE_URL."
            exit 1
          fi

          if [ -z "${BACKEND_CORS_ORIGINS}" ]; then
            echo "Missing required GitHub variable BACKEND_CORS_ORIGINS."
            exit 1
          fi

          python - <<'PY'
          import json
          import os

          payload = {
              "Variables": {
                  "APP_ENV": os.environ["GITHUB_REF_NAME"],
                  "ALLOW_LOCAL_AUTH": os.environ["BACKEND_ALLOW_LOCAL_AUTH"],
                  "CORS_ORIGINS": os.environ["BACKEND_CORS_ORIGINS"],
                  "DATABASE_MAX_OVERFLOW": "2",
                  "DATABASE_POOL_RECYCLE_SECONDS": "300",
                  "DATABASE_POOL_SIZE": "1",
                  "DATABASE_URL": os.environ["BACKEND_DATABASE_URL"],
                  "LOG_LEVEL": "INFO",
                  "SUPABASE_JWT_SECRET": "",
                  "SUPABASE_SERVICE_ROLE_KEY": "",
                  "SUPABASE_STORAGE_BUCKET": "financial-files",
                  "SUPABASE_URL": "",
              }
          }

          with open("build/lambda-env.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY

          DATABASE_URL="${BACKEND_DATABASE_URL}" PYTHONPATH="build/lambda" python -m alembic upgrade head

          aws lambda update-function-code \
            --function-name "${BACKEND_LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://build/backend-lambda.zip

          aws lambda wait function-updated-v2 \
            --function-name "${BACKEND_LAMBDA_FUNCTION_NAME}"

          aws lambda update-function-configuration \
            --function-name "${BACKEND_LAMBDA_FUNCTION_NAME}" \
            --environment file://build/lambda-env.json

          aws lambda wait function-updated-v2 \
            --function-name "${BACKEND_LAMBDA_FUNCTION_NAME}"
