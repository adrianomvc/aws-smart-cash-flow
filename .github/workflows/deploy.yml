name: Deploy

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    if: ${{ vars.TERRAFORM_DEPLOY_ENABLED == 'true' && vars.AWS_ROLE_TO_ASSUME != '' && vars.AWS_REGION != '' }}
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_amplify_app_arn: ${{ vars.AMPLIFY_APP_ARN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply
        run: terraform apply -auto-approve

  deploy-frontend:
    name: Trigger Amplify deploy
    runs-on: ubuntu-latest
    needs: terraform
    if: ${{ always() && !failure() && vars.AWS_ROLE_TO_ASSUME != '' && vars.AWS_REGION != '' && vars.AMPLIFY_APP_ID != '' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Trigger branch deploy
        run: |
          aws amplify start-job \
            --app-id "${{ vars.AMPLIFY_APP_ID }}" \
            --branch-name "${{ github.ref_name }}" \
            --job-type RELEASE

  backend-deploy-placeholder:
    name: Backend deploy gate
    runs-on: ubuntu-latest
    steps:
      - name: Explain backend deploy status
        run: |
          echo "Backend deploy is intentionally disabled until infra/Lambda template is added."
          echo "Frontend Amplify deploy runs when AWS_ROLE_TO_ASSUME, AWS_REGION and AMPLIFY_APP_ID vars are configured."
