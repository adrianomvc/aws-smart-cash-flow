[project]
name = "aws-smart-cash-flow-backend"
version = "0.1.0"
description = "Serverless Python backend for aws-smart-cash-flow"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "mangum>=0.17",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "supabase>=2.6",
  "uvicorn>=0.30",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.0",
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
